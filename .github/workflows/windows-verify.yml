name: Windows installer verification
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows release build run ID
        required: true
        type: string
      verify_upgrade:
        description: Verify the live upgrade from 0.3.6 to the published release
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gaon-erp-windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Install, inspect and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'GAON-Installer-Verification'
          $setup = (Resolve-Path 'GAON-ERP-Setup-x64.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S',("/D=" + $installDir) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'GAON ERP.exe'
          $asar = Join-Path $installDir 'resources/app.asar'
          $pdf = Join-Path $installDir 'resources/GAON-ERP-Quickstart.pdf'
          foreach ($path in @($exe,$asar,$pdf)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Installed file missing: $path" }
          }
          $version = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if (-not $version) { throw 'Installed product version missing' }
          $client = $null
          $clientStarted = $false
          try {
            $client = Start-Process -FilePath $exe -PassThru
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $client.Refresh()
              if ($client.HasExited) { throw "Installed app exited before showing its window: $($client.ExitCode)" }
              if ($client.MainWindowHandle -ne 0 -and $client.MainWindowTitle -eq 'GAON ERP') {
                $clientStarted = $true
                break
              }
            }
            if (-not $clientStarted) { throw 'Installed app did not show the GAON ERP window within 15 seconds' }
            Write-Host 'Installed app launch verified: GAON ERP window is visible'
          }
          finally {
            if ($null -ne $client -and -not $client.HasExited) {
              [void]$client.CloseMainWindow()
              if (-not $client.WaitForExit(5000)) {
                Stop-Process -Id $client.Id -Force
                $client.WaitForExit()
              }
            }
          }
          $uninstaller = @(Get-ChildItem -LiteralPath $installDir -Filter '*Uninstall*.exe')
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing or ambiguous' }
          $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw 'App remains after uninstall' }
          $result = @{ installerExit = $install.ExitCode; uninstallerExit = $uninstall.ExitCode; version = $version; installedClient = $true; installedClientLaunched = $clientStarted; installedManual = $true; removedClient = $true; platform = 'Windows x64' }
          $result | ConvertTo-Json | Tee-Object -FilePath 'windows-installer-verification.json'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification
          path: windows-installer-verification.json
          retention-days: 7
          if-no-files-found: error

      - name: Verify published update from installed 0.3.6
        if: inputs.verify_upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = ((Get-Content latest.yml | Select-String '^version: (.+)$').Matches[0].Groups[1].Value).Trim()
          if ([version]$expected -le [version]'0.3.6') { throw 'Invalid upgrade target' }
          $old = Join-Path $env:RUNNER_TEMP 'GAON-036.exe'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/GAON ERP'
          Invoke-WebRequest -Uri 'https://github.com/hykeelson/GAONERP-releases/releases/download/v0.3.6/GAON-ERP-Setup-x64.exe' -OutFile $old
          $p = Start-Process $old -ArgumentList '/S' -Wait -PassThru
          $installed = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'GAON ERP.exe' -Recurse)
          if ($installed.Count -ne 1) { throw 'Default GAON install location not found' }
          $dir = $installed[0].DirectoryName
          if ($p.ExitCode -ne 0) { throw 'Baseline install failed' }
          $exe = Join-Path $dir 'GAON ERP.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion.TrimEnd() -notin '0.3.6','0.3.6.0') { throw 'Wrong baseline' }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $client = Start-Process $exe -PassThru
          $root = [Windows.Automation.AutomationElement]::RootElement
          $byPid = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$client.Id)
          $byButton = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'지금 다시 시작')
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class GaonUpdateButton {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint msg,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetSubMenu(IntPtr h,int p);
            [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr h);
            [DllImport("user32.dll")] public static extern uint GetMenuItemID(IntPtr h,int p);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetMenuString(IntPtr h,uint p,System.Text.StringBuilder text,int max,uint flag);
          }
          "@
          Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class UpgradeWindows {
            public delegate bool EnumProc(IntPtr h,IntPtr data);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb,IntPtr data);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent,EnumProc cb,IntPtr data);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint process);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder text,int max);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder text,int max);
            [DllImport("user32.dll")] public static extern int GetDlgCtrlID(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            public static string Caption(IntPtr h) {var s=new StringBuilder(512);GetWindowText(h,s,512);return s.ToString();}
            public static bool Click(uint process,string pattern) {
              bool clicked=false;
              EnumWindows((w,d)=>{
                uint p;GetWindowThreadProcessId(w,out p);
                if(p!=process || !IsWindowVisible(w))return true;
                EnumChildWindows(w,(c,v)=>{
                  var cls=new StringBuilder(64);GetClassName(c,cls,64);
                  var label=Caption(c).Replace("&","").Trim();
                  if(cls.ToString()!="Button" || !IsWindowVisible(c) || !IsWindowEnabled(c) || !System.Text.RegularExpressions.Regex.IsMatch(label,pattern,System.Text.RegularExpressions.RegexOptions.IgnoreCase))return true;
                  Console.WriteLine("Windows UI: "+Caption(w)+" / "+label);
                  clicked=PostMessage(c,0x00F5,IntPtr.Zero,IntPtr.Zero);
                  return !clicked;
                },IntPtr.Zero);
                return !clicked;
              },IntPtr.Zero);
              return clicked;
            }
          }
          "@
          $clicked = $false
          for ($i=0; $i -lt 90 -and !$clicked; $i++) {
            Start-Sleep -Seconds 2
            foreach ($win in $root.FindAll([Windows.Automation.TreeScope]::Children,$byPid)) {
              $b=$win.FindFirst([Windows.Automation.TreeScope]::Descendants,$byButton)
              if (!$b) { continue }
              Write-Host 'Installed 0.3.6 offered its downloaded update'
              $shell=New-Object -ComObject WScript.Shell
              if (!$shell.AppActivate('GAON ERP 업데이트')) { continue }
              $shell.SendKeys('{ENTER}'); $clicked=$true; break
            }
          }
          if (!$clicked) { throw 'No restart confirmation' }
          for ($i=0; $i -lt 65; $i++) {
            Start-Sleep -Seconds 2
            $setups = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like 'GAON-ERP-Setup*' -or $_.MainWindowTitle -eq 'GAON ERP Setup' })
            foreach ($setup in $setups) {
              [void][UpgradeWindows]::Click($setup.Id,'^(다음|설치|마침|완료|종료|확인|Next|Install|Finish|Close|OK)(\s|$|[>(])')
            }
            if (!(Test-Path $exe) -or (Get-Item $exe).VersionInfo.ProductVersion -notin $expected,($expected+'.0')) { continue }
            $new = @(Get-Process -Name 'GAON ERP' -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $client.Id -and $_.MainWindowHandle -ne 0 -and $_.Path -eq $exe })
            if ($new.Count) { Write-Host "Verified published 0.3.6 -> $expected and relaunched GUI"; exit 0 }
          }
          Get-Process | Where-Object { $_.ProcessName -match 'GAON|setup' -or $_.MainWindowTitle -match 'GAON' } | Format-Table Id,ProcessName,MainWindowTitle
          throw 'New version and relaunched window not verified'
