name: Windows installer verification
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows release build run ID
        required: true
        type: string
      verify_upgrade:
        description: Verify the live upgrade from 0.3.5 to the published release
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gaon-erp-windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Install, inspect and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'GAON-Installer-Verification'
          $setup = (Resolve-Path 'GAON-ERP-Setup-x64.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S',("/D=" + $installDir) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'GAON ERP.exe'
          $asar = Join-Path $installDir 'resources/app.asar'
          $pdf = Join-Path $installDir 'resources/GAON-ERP-Quickstart.pdf'
          foreach ($path in @($exe,$asar,$pdf)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Installed file missing: $path" }
          }
          $version = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if (-not $version) { throw 'Installed product version missing' }
          $client = $null
          $clientStarted = $false
          try {
            $client = Start-Process -FilePath $exe -PassThru
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $client.Refresh()
              if ($client.HasExited) { throw "Installed app exited before showing its window: $($client.ExitCode)" }
              if ($client.MainWindowHandle -ne 0 -and $client.MainWindowTitle -eq 'GAON ERP') {
                $clientStarted = $true
                break
              }
            }
            if (-not $clientStarted) { throw 'Installed app did not show the GAON ERP window within 15 seconds' }
            Write-Host 'Installed app launch verified: GAON ERP window is visible'
          }
          finally {
            if ($null -ne $client -and -not $client.HasExited) {
              [void]$client.CloseMainWindow()
              if (-not $client.WaitForExit(5000)) {
                Stop-Process -Id $client.Id -Force
                $client.WaitForExit()
              }
            }
          }
          $uninstaller = @(Get-ChildItem -LiteralPath $installDir -Filter '*Uninstall*.exe')
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing or ambiguous' }
          $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw 'App remains after uninstall' }
          $result = @{ installerExit = $install.ExitCode; uninstallerExit = $uninstall.ExitCode; version = $version; installedClient = $true; installedClientLaunched = $clientStarted; installedManual = $true; removedClient = $true; platform = 'Windows x64' }
          $result | ConvertTo-Json | Tee-Object -FilePath 'windows-installer-verification.json'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification
          path: windows-installer-verification.json
          retention-days: 7
          if-no-files-found: error

      - name: Verify published update from installed 0.3.5
        if: inputs.verify_upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = ((Get-Content latest.yml | Select-String '^version: (.+)$').Matches[0].Groups[1].Value).Trim()
          if ([version]$expected -le [version]'0.3.5') { throw 'Invalid upgrade target' }
          $old = Join-Path $env:RUNNER_TEMP 'GAON-035.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'GAON-Upgrade-Test'
          Invoke-WebRequest -Uri 'https://github.com/hykeelson/GAONERP-releases/releases/download/v0.3.5/GAON-ERP-Setup-x64.exe' -OutFile $old
          $p = Start-Process $old -ArgumentList '/S',("/D=" + $dir) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Baseline install failed' }
          $exe = Join-Path $dir 'GAON ERP.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion.TrimEnd() -notin '0.3.5','0.3.5.0') { throw 'Wrong baseline' }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $client = Start-Process $exe -PassThru
          $root = [Windows.Automation.AutomationElement]::RootElement
          $byPid = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$client.Id)
          $byButton = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'지금 다시 시작')
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class GaonUpdateButton {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
          }
          "@
          $clicked = $false
          for ($i = 0; $i -lt 120 -and !$clicked; $i++) {
            Start-Sleep -Seconds 2
            foreach ($win in $root.FindAll([Windows.Automation.TreeScope]::Children,$byPid)) {
              $button = $win.FindFirst([Windows.Automation.TreeScope]::Descendants,$byButton)
              if ($button) {
                $invoke = $null
                if ($button.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern,[ref]$invoke)) {
                  $invoke.Invoke()
                } else {
                  # The native dialog can expose the caption as a text child of a button.
                  $target = $button
                  while ($target -and $target.Current.ControlType -ne [Windows.Automation.ControlType]::Button) {
                    $target = [Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($target)
                  }
                  if ($target -and $target.Current.NativeWindowHandle) {
                    if (![GaonUpdateButton]::PostMessage([IntPtr]$target.Current.NativeWindowHandle,0x00F5,[IntPtr]::Zero,[IntPtr]::Zero)) { throw 'Restart button did not accept click' }
                  } else {
                    # Electron sets Restart now as the default. Activate only this verified update dialog.
                    $sh = New-Object -ComObject WScript.Shell
                    if (!$sh.AppActivate('GAON ERP 업데이트')) { throw 'Could not activate update dialog' }
                    $sh.SendKeys('{ENTER}')
                  }
                }
                $clicked = $true
                break
              }
            }
          }
          if (!$clicked) { throw 'Installed 0.3.5 did not offer the live update' }
          for ($i = 0; $i -lt 75; $i++) {
            Start-Sleep -Seconds 2
            $new = @(Get-Process -Name 'GAON ERP' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.Id -ne $client.Id -and $_.MainWindowHandle -ne 0 })
            if ($new.Count -and (Get-Item $exe).VersionInfo.ProductVersion -in $expected,($expected+'.0')) {
              Write-Host "Installed 0.3.5 downloaded the published update and relaunched $expected."
              exit 0
            }
          }
          throw 'Updated app did not relaunch from the baseline installation'
